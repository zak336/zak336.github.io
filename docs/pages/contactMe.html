  <div class="containerContactMe">
    <div class="card-form" style="margin-bottom:2rem;">
      <h3>Email Me Directly</h3>
      <form action="mailto:zakeeukme@gmail.com" method="post" enctype="text/plain">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button class="buttonContactMe contact-button" type="submit">
          <img src="../images/contact-form.png" class="resizable-icon" alt="Email Icon"> Send Email
        </button>
      </form>
    </div>
    <div class="card-form">

  <script src="../script/main.js"></script>
  <script>
    // Theme toggle logic
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
    });
    // On load, set theme from localStorage
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  </script>
</body>

</html>
